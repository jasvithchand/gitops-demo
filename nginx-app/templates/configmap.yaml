apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-app-config
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <body>
        <h1>{{ .Values.config.message }}</h1>
        <p>Deployed by ArgoCD via GitOps</p>
        <p>Image: {{ .Values.image.repository }}:{{ .Values.image.tag }}</p>
        <p>Replicas configured: {{ .Values.replicaCount }}</p>
      </body>
    </html>
