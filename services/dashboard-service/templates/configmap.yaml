apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-html
  namespace: services
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>LinkPulse</title>
      <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
        .logo{font-size:2.5rem;font-weight:700;color:#38bdf8;margin-bottom:.5rem}
        .tagline{color:#94a3b8;margin-bottom:3rem;font-size:1.1rem}
        .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:2rem;width:100%;max-width:500px;margin-bottom:2rem}
        h2{font-size:.9rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1rem}
        input{width:100%;padding:.75rem 1rem;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:1rem;margin-bottom:.75rem;outline:none}
        input:focus{border-color:#38bdf8}
        button{width:100%;padding:.75rem;background:#38bdf8;color:#0f172a;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
        .result{margin-top:1rem;padding:.75rem;background:#0f172a;border-radius:8px;font-family:monospace;color:#38bdf8;display:none;word-break:break-all}
        .services{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;width:100%;max-width:500px}
        .svc{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:1rem;text-align:center}
        .svc-name{font-size:.8rem;color:#94a3b8;margin-bottom:.25rem}
        .ok{color:#4ade80;font-weight:600;font-size:.8rem}
        .err{color:#f87171;font-weight:600;font-size:.8rem}
      </style>
    </head>
    <body>
      <div class="logo">⚡ LinkPulse</div>
      <div class="tagline">URL shortener — running on Kubernetes</div>
      <div class="card">
        <h2>Shorten a URL</h2>
        <input type="email" id="email" placeholder="email" value="jasvith@linkpulse.io">
        <input type="password" id="password" placeholder="password" value="password123">
        <input type="url" id="url" placeholder="https://example.com">
        <button onclick="shorten()">Shorten →</button>
        <div class="result" id="result"></div>
      </div>
      <div class="services">
        <div class="svc"><div class="svc-name">auth-service</div><div id="s1" class="ok">checking...</div></div>
        <div class="svc"><div class="svc-name">shortener-service</div><div id="s2" class="ok">checking...</div></div>
        <div class="svc"><div class="svc-name">redirect-service</div><div id="s3" class="ok">checking...</div></div>
        <div class="svc"><div class="svc-name">analytics-service</div><div id="s4" class="ok">checking...</div></div>
      </div>
      <script>
        const svcs = [
          ['http://localhost:3001','s1'],
          ['http://localhost:3002','s2'],
          ['http://localhost:3003','s3'],
          ['http://localhost:3004','s4'],
        ];
        async function check([url,id]){
          try{const r=await fetch(url+'/health');const d=await r.json();document.getElementById(id).textContent='● '+d.status;document.getElementById(id).className='ok';}
          catch{document.getElementById(id).textContent='● offline';document.getElementById(id).className='err';}
        }
        svcs.forEach(check);setInterval(()=>svcs.forEach(check),15000);
        async function shorten(){
          const email=document.getElementById('email').value;
          const password=document.getElementById('password').value;
          const url=document.getElementById('url').value;
          const result=document.getElementById('result');
          if(!url){result.style.display='block';result.textContent='Enter a URL';return;}
          try{
            const lr=await fetch('http://localhost:3001/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
            const {token}=await lr.json();
            const sr=await fetch('http://localhost:3002/links',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({url})});
            const link=await sr.json();
            result.style.display='block';result.textContent=link.short_url||JSON.stringify(link);
          }catch(e){result.style.display='block';result.textContent='Error: '+e.message;}
        }
      </script>
    </body>
    </html>
