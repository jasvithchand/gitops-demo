replicaCount: 2
image:
  repository: ghcr.io/jasvithchand/redirect-service
  tag: "latest"
  pullPolicy: Always
service:
  port: 3003
config:
  port: "3003"
  nodeEnv: "production"
  redisUrl: "redis://redis-0.redis.data.svc.cluster.local:6379"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 128Mi
