apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shortener-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jasvithchand/gitops-demo
    targetRevision: HEAD
    path: services/shortener-service
  destination:
    server: https://kubernetes.default.svc
    namespace: services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
