# This is a SealedSecret — safe to commit to Git.
# The sealed-secrets-controller in kube-system will decrypt this
# and create a regular Kubernetes Secret named postgres-secret in the data namespace.
#
# To update the password:
#   1. Run the kubeseal command again with the new password
#   2. Replace the encryptedData values below
#   3. Push to Git — ArgoCD will sync and controller will re-decrypt
#
# NEVER put the plaintext password in this file or anywhere in Git.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: data
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: postgres-secret
      namespace: data